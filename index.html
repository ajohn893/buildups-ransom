<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f2" />
    <title>SafeKey — Password Generator</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #19251f;
        background: #f5f7f2;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 10% 10%, rgb(216 235 218 / 55%), transparent 35%),
          radial-gradient(ellipse at 90% 90%, rgb(222 230 211 / 52%), transparent 34%),
          #f5f7f2;
      }

      .app {
        width: min(100%, 520px);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 36px;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 10px;
        color: #fff;
        background: #276a4b;
      }

      .brand-mark svg {
        width: 18px;
        height: 18px;
      }

      .card {
        overflow: hidden;
        border: 1px solid #e4e9e1;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 80px rgb(39 64 47 / 9%), 0 3px 10px rgb(39 64 47 / 4%);
      }

      .content {
        padding: 42px 42px 36px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #43805f;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 7vw, 36px);
        font-weight: 720;
        letter-spacing: -0.055em;
        line-height: 1.12;
      }

      .intro {
        max-width: 340px;
        margin: 14px auto 30px;
        color: #738078;
        font-size: 14px;
        line-height: 1.65;
      }

      .password-box {
        display: flex;
        min-height: 76px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 17px 16px 20px;
        border: 1px solid #e6ebe5;
        border-radius: 14px;
        background: #f8faf7;
        text-align: left;
      }

      .password {
        overflow: hidden;
        color: #26352c;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: clamp(16px, 4.3vw, 20px);
        font-weight: 650;
        letter-spacing: 0.045em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .copy-button {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 10px;
        color: #54705e;
        background: transparent;
        cursor: pointer;
        transition: background 150ms ease, color 150ms ease;
      }

      .copy-button:hover {
        color: #276a4b;
        background: #eaf2eb;
      }

      .copy-button:focus-visible,
      .generate-button:focus-visible {
        outline: 3px solid #a5cfad;
        outline-offset: 3px;
      }

      .copy-button svg {
        width: 19px;
        height: 19px;
      }

      .generate-button {
        width: 100%;
        min-height: 54px;
        margin-top: 16px;
        border: 0;
        border-radius: 13px;
        color: #fff;
        background: #276a4b;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
      }

      .generate-button:hover {
        background: #205c40;
        box-shadow: 0 7px 16px rgb(39 106 75 / 18%);
        transform: translateY(-1px);
      }

      .generate-button:active {
        transform: translateY(0);
      }

      .button-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
      }

      .button-label svg {
        width: 17px;
        height: 17px;
      }

      .details {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 20px;
        color: #738078;
        font-size: 12px;
      }

      .detail {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }

      .detail svg {
        width: 15px;
        height: 15px;
        color: #43805f;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 17px 20px;
        border-top: 1px solid #edf0eb;
        color: #78837b;
        font-size: 11px;
      }

      .footer svg {
        width: 14px;
        height: 14px;
        color: #43805f;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      @media (max-width: 460px) {
        .content {
          padding: 34px 24px 28px;
        }

        .details {
          justify-content: center;
          flex-wrap: wrap;
          column-gap: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="brand" aria-label="SafeKey">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 10V7a5 5 0 0 1 10 0v3m-11 0h12a2 2 0 0 1 2 2v8H4v-8a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 14v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </span>
        SafeKey
      </div>

      <section class="card" aria-labelledby="heading">
        <div class="content">
          <p class="eyebrow">Your security, simplified</p>
          <h1 id="heading">A stronger password<br />in one click.</h1>
          <p class="intro">Create a unique, random password to help keep your accounts safe.</p>

          <div class="password-box">
            <output class="password" id="password" aria-label="Generated password" aria-live="polite">Click generate to begin</output>
            <button class="copy-button" id="copy" type="button" aria-label="Copy password" title="Copy password" disabled>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.7" />
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
              </svg>
            </button>
          </div>

          <button class="generate-button" id="generate" type="button">
            <span class="button-label">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 7v5h-5M4.8 9a7.5 7.5 0 0 1 12.8-2L20 12M4 17v-5h5m10.2 3a7.5 7.5 0 0 1-12.8 2L4 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              Generate password
            </span>
          </button>

          <div class="details" aria-label="Password details">
            <span class="detail">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
              16 characters
            </span>
            <span class="detail">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              Letters &amp; numbers
            </span>
          </div>
          <span class="sr-only" id="status" role="status" aria-live="polite"></span>
        </div>
        <div class="footer">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 10V7a5 5 0 0 1 10 0v3m-11 0h12a2 2 0 0 1 2 2v8H4v-8a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Generated privately on your device
        </div>
      </section>
    </main>

    <script>
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      const passwordOutput = document.getElementById("password");
      const copyButton = document.getElementById("copy");
      const status = document.getElementById("status");
      let currentPassword = "";

      function generatePassword() {
        const password = [];
        const randomValues = new Uint8Array(32);

        while (password.length < 16) {
          crypto.getRandomValues(randomValues);
          for (const value of randomValues) {
            if (value < 248) {
              password.push(alphabet[value % alphabet.length]);
              if (password.length === 16) break;
            }
          }
        }

        return password.join("");
      }

      document.getElementById("generate").addEventListener("click", () => {
        currentPassword = generatePassword();
        passwordOutput.textContent = currentPassword;
        copyButton.disabled = false;
        status.textContent = "A new password was generated.";
      });

      copyButton.addEventListener("click", async () => {
        if (!currentPassword) return;

        try {
          await navigator.clipboard.writeText(currentPassword);
          status.textContent = "Password copied to clipboard.";
          copyButton.title = "Copied!";
        } catch (error) {
          status.textContent = "Could not copy the password. Please select and copy it manually.";
          copyButton.title = "Copy unavailable";
        }
      });
    </script>
  </body>
</html>
